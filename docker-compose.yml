# WINDOWS + LINUX (default): SOURCE=browser. Open the dashboard and Start camera.
# No host Python/helper is needed. The browser tab must stay open for capture.
# LINUX unattended option: set SOURCE=0 and uncomment devices below.
# GPU access is enabled below. Comment out deploy for machines without NVIDIA GPUs.
services:
  person-detector:
    build:
      context: .
      dockerfile: Dockerfile
    image: person-detector:latest
    container_name: person-detector
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      SOURCE: ${SOURCE:-browser}
      MODEL: ${MODEL:-/app/yolo26n-seg.pt}
      DEVICE: ${DEVICE:-auto}
      CONF: ${CONF:-0.25}
      IMGSZ: ${IMGSZ:-640}
      FRAME_GAP: ${FRAME_GAP:-15}
      THRESHOLD: ${THRESHOLD:-0.70}
      TRACK_THRESHOLD: ${TRACK_THRESHOLD:-0.60}
      TRACK_IOU: ${TRACK_IOU:-0.30}
      TRACK_TIMEOUT: ${TRACK_TIMEOUT:-3.0}
      MIN_BOX: ${MIN_BOX:-48}
      SAMPLE_INTERVAL: ${SAMPLE_INTERVAL:-3.0}
      MAX_SAMPLES: ${MAX_SAMPLES:-30}
      GALLERY: ${GALLERY:-/app/gallery_segmented}
      COOLDOWN: ${COOLDOWN:-60.0}
      HOST: ${HOST:-0.0.0.0}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-5000}
      LATEST_COUNT: ${LATEST_COUNT:-12}
    # Optional LINUX direct webcam: keeps detecting after closing the dashboard.
    # Set SOURCE=0; VIDEO_DEVICE selects the host camera mapped to index 0.
    # Keep these two lines commented on Windows and when using SOURCE=browser.
    # devices:
    #   - ${VIDEO_DEVICE:-/dev/video0}:/dev/video0

    # NVIDIA GPU: enabled. Comment out this entire block for CPU-only machines.
    # Windows: Docker Desktop WSL 2 backend + supported NVIDIA Windows driver.
    # Linux: NVIDIA Container Toolkit configured for Docker Engine.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all
    volumes:
      - ./gallery_segmented:/app/gallery_segmented
      - ./data:/app/data
      - ./yolo26n-seg.pt:/app/yolo26n-seg.pt:ro
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-5000}:${DASHBOARD_PORT:-5000}"
    command: >
      python detect_and_email.py
      --source "${SOURCE:-browser}"
      --model ${MODEL:-/app/yolo26n-seg.pt}
      --conf ${CONF:-0.25}
      --imgsz ${IMGSZ:-640}
      --device ${DEVICE:-auto}
      --frame-gap ${FRAME_GAP:-15}
      --threshold ${THRESHOLD:-0.70}
      --track-threshold ${TRACK_THRESHOLD:-0.60}
      --track-iou ${TRACK_IOU:-0.30}
      --track-timeout ${TRACK_TIMEOUT:-3.0}
      --min-box ${MIN_BOX:-48}
      --sample-interval ${SAMPLE_INTERVAL:-3.0}
      --max-samples ${MAX_SAMPLES:-30}
      --gallery ${GALLERY:-/app/gallery_segmented}
      --cooldown ${COOLDOWN:-60.0}
      --host ${HOST:-0.0.0.0}
      --dashboard-port ${DASHBOARD_PORT:-5000}
      --latest-count ${LATEST_COUNT:-12}
      --dashboard
      ${VERBOSE:+--verbose}
